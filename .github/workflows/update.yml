name: Refresh and deploy

on:
  schedule:
    # The Cloudflare Worker in worker/ starts this every 15 minutes. GitHub's own
    # cron skips most runs here, so it's only an hourly backup.
    - cron: '37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh every pane, ignoring per-pane intervals'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch feeds
        env:
          SITE_URL: https://knowbase.vishaltharu.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          KB_MODEL: ${{ vars.KB_MODEL }}
        run: node scripts/build-data.mjs ${{ (github.event_name == 'push' || inputs.force) && '--force' || '' }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
